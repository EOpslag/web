name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job opts in to what it needs.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Frozen lockfile + no lifecycle scripts: a compromised dependency cannot run code during install.
      - name: Install dependencies
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Type-check and lint
        run: |
          yarn -s tsc -b
          yarn -s lint

      # Pages reports http:// until the HTTPS certificate exists; canonical/OG/sitemap must always be https.
      # A repository variable SITE_URL (Settings → Variables) overrides the Pages-reported URL.
      - name: Resolve site URL
        env:
          RAW_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}
        run: echo "SITE_URL=${RAW_URL/#http:\/\//https://}" >> "$GITHUB_ENV"

      - name: Build
        run: yarn -s build

      # Fails the pipeline on unfilled legal placeholders, forbidden third-party hosts, missing CSP, etc.
      - name: Launch gate
        run: node scripts/check-launch.mjs --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish to Pages
      id-token: write # OIDC token required by deploy-pages
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
